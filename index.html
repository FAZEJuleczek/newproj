<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Identity Manager PRO</title>
    <style>
        :root {
            --primary: #0052a5;
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #1c1c1e;
            --text-sec: #8e8e93;
            --safe-top: env(safe-area-inset-top);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: var(--text); overflow: hidden; height: 100vh;
        }

        /* --- FRAMEWORK SPA --- */
        .view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg); z-index: 1; display: flex; flex-direction: column;
        }
        .view-hidden { transform: translateX(100%); }
        .view-active { transform: translateX(0); z-index: 10; }

        /* --- DASHBOARD --- */
        header { 
            padding: calc(var(--safe-top) + 20px) 20px 20px; 
            background: var(--card); display: flex; justify-content: space-between; align-items: center;
        }
        .logo { width: 40px; height: 40px; cursor: pointer; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        
        .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .tile { 
            background: var(--card); border-radius: 22px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column;
            align-items: center; transition: transform 0.1s;
        }
        .tile:active { transform: scale(0.95); background: #f9f9f9; }
        .tile svg { width: 32px; height: 32px; margin-bottom: 12px; }
        .tile b { font-size: 14px; }

        /* --- DOKUMENT (mDowód) --- */
        .card-wrapper { perspective: 1000px; padding: 10px; }
        .id-card {
            width: 100%; height: 220px; background: white; border-radius: 24px;
            position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.6s; transform-style: preserve-3d;
        }
        .id-card.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            padding: 20px; display: flex;
        }
        .card-back { transform: rotateY(180deg); flex-direction: column; align-items: center; justify-content: center; }

        /* Canvas Background */
        #guilloche { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; }

        /* Foto z Shimmerem */
        .photo-container {
            width: 100px; height: 130px; border-radius: 12px; overflow: hidden;
            position: relative; z-index: 2; background: #eee; border: 0.5px solid #ddd;
        }
        #display-photo { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }
        .shimmer {
            position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: shine 3s infinite;
        }
        @keyframes shine { 100% { left: 200%; } }

        .data-overlay { flex: 1; padding-left: 15px; z-index: 2; }
        .field { margin-bottom: 6px; }
        .f-lab { font-size: 9px; color: var(--text-sec); font-weight: bold; text-transform: uppercase; }
        .f-val { font-size: 14px; font-weight: 800; }

        /* --- UKRYTY PANEL ADMINA --- */
        #admin-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999; display: none;
            color: white; padding: 40px 20px; overflow-y: auto;
        }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        .close-admin { background: #ff3b30; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-top: 20px; }

        /* --- BOTTOM NAV --- */
        nav {
            position: fixed; bottom: 0; width: 100%; height: 85px; background: white;
            display: flex; justify-content: space-around; padding-top: 10px; border-top: 0.5px solid #d1d1d6; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sec); font-size: 10px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="view-main" class="view view-active">
        <header>
            <div class="logo" onclick="handleLogoClick()">
                <svg viewBox="0 0 24 24" fill="var(--primary)"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5S13.4 12 12 12s-2.5-1.1-2.5-2.5S10.6 7 12 7zm0 14c-2.7 0-5.2-1.5-6.5-3.8.1-1.3 2.6-2.2 6.5-2.2s6.4.9 6.5 2.2c-1.3 2.3-3.8 3.8-6.5 3.8z"/></svg>
            </div>
            <b style="font-size: 20px;">Dzień dobry</b>
            <div style="width:40px"></div>
        </header>
        <div class="content">
            <div class="tile-grid">
                <div class="tile" onclick="showView('view-doc')">
                    <svg fill="var(--primary)" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    <b>mDowód</b>
                    <span style="font-size:10px; color:gray">Tożsamość</span>
                </div>
                <div class="tile" onclick="alert('Punkty: 0')">
                    <svg fill="#ff9500" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                    <b>Punkty Karne</b>
                    <span style="font-size:10px; color:gray">Aktywne: 0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="view-doc" class="view view-hidden">
        <header>
            <div onclick="showView('view-main')" style="color:var(--primary); font-weight:bold; cursor:pointer">〈 Wróć</div>
            <b style="font-size: 17px;">mDowód</b>
            <div style="width:40px"></div>
        </header>
        <div class="content">
            <div class="card-wrapper">
                <div class="id-card" id="idCard" onclick="this.classList.toggle('flipped')">
                    <div class="card-front">
                        <canvas id="guilloche"></canvas>
                        <div class="photo-container">
                            <img id="display-photo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
                            <div class="shimmer"></div>
                        </div>
                        <div class="data-overlay">
                            <div class="field"><div class="f-lab">Nazwisko</div><div class="f-val" id="res-sur">KOWALSKI</div></div>
                            <div class="field"><div class="f-lab">Imię</div><div class="f-val" id="res-name">JAN ADAM</div></div>
                            <div class="field"><div class="f-lab">PESEL</div><div class="f-val" id="res-pes">85010112345</div></div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div style="background:black; width:100px; height:100px; padding:5px; background:white; border:1px solid #ccc">
                            <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v2h-3v-2zm-3 0h2v2h-2v-2z"/></svg>
                        </div>
                        <p style="font-size:10px; margin-top:10px">KOD QR DO WERYFIKACJI</p>
                    </div>
                </div>
            </div>
            <div id="clock" style="text-align:center; margin-top:20px; font-weight:bold; color:var(--text-sec); font-size:12px;"></div>
        </div>
    </div>

    <div id="admin-panel">
        <h2>Panel Edycji Tożsamości</h2>
        <input type="text" id="in-name" placeholder="Imię">
        <input type="text" id="in-sur" placeholder="Nazwisko">
        <input type="text" id="in-pes" placeholder="PESEL">
        <p>Wgraj zdjęcie:</p>
        <input type="file" id="in-photo" accept="image/*">
        <div class="close-admin" onclick="updateAndClose()">ZAPISZ I ZAMKNIJ</div>
    </div>

    <nav>
        <div class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Start</span>
        </div>
        <div class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z"/></svg>
            <span>Dokumenty</span>
        </div>
    </nav>

    <script>
        // --- LOGIKA SPA ---
        function showView(id) {
            document.querySelectorAll('.view').forEach(v => {
                v.classList.remove('view-active');
                v.classList.add('view-hidden');
            });
            const active = document.getElementById(id);
            active.classList.remove('view-hidden');
            active.classList.add('view-active');
        }

        // --- UKRYTY ADMIN ---
        let clickCount = 0;
        function handleLogoClick() {
            clickCount++;
            if(clickCount >= 3) {
                document.getElementById('admin-panel').style.display = 'block';
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 2000);
        }

        function updateAndClose() {
            const name = document.getElementById('in-name').value;
            const sur = document.getElementById('in-sur').value;
            const pes = document.getElementById('in-pes').value;
            const photoInput = document.getElementById('in-photo');

            if(name) document.getElementById('res-name').innerText = name.toUpperCase();
            if(sur) document.getElementById('res-sur').innerText = sur.toUpperCase();
            if(pes) document.getElementById('res-pes').innerText = pes;

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('display-photo').src = e.target.result;
                }
                reader.readAsDataURL(photoInput.files[0]);
            }

            document.getElementById('admin-panel').style.display = 'none';
        }

        // --- ANIMACJA GUILLOCHE (CANVAS) ---
        const canvas = document.getElementById('guilloche');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;
        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = '#0052a5';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            for (let i = 0; i < width; i += 5) {
                let y = Math.sin(i * 0.02 + time) * 20 + height / 2;
                ctx.lineTo(i, y);
            }
            ctx.stroke();
            time += 0.05;
            requestAnimationFrame(draw);
        }
        draw();

        // --- ZEGAR ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = `CZAS: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
