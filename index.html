<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mObywatel 2.0</title>
    <style>
        body { margin: 0; background: #F5F6FA; font-family: sans-serif; }
        
        /* Górny pasek z flagą - teraz identyczny */
        .top-bar {
            background: white; padding: 45px 20px 15px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #E5E5E5;
        }
        .flag { width: 35px; height: 22px; background: linear-gradient(#fff 50%, #dc2626 50%); border: 1px solid #ddd; }

        /* Karta mDowodu */
        .id-card {
            background: white; margin: 15px; border-radius: 20px;
            padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative; overflow: hidden;
        }
        
        .id-card::before { /* Ten specyficzny wzorek w tle */
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.03; pointer-events: none;
        }

        .row { display: flex; align-items: flex-start; }
        
        .photo-area {
            width: 110px; height: 145px; background: #E8E8E8;
            border-radius: 12px; margin-right: 20px; position: relative;
        }

        .data-area { flex: 1; }
        
        .field { margin-bottom: 8px; }
        .label { color: #888; font-size: 10px; text-transform: uppercase; font-weight: bold; }
        .value { color: #222; font-size: 15px; font-weight: 800; }

        /* Pasek czasu na dole karty */
        .status-time {
            background: #F0F2F8; border-radius: 10px; padding: 8px;
            margin-top: 15px; font-size: 11px; text-align: center; color: #444;
        }

        /* Dolne menu przycisków */
        .menu-item {
            background: white; margin: 0 15px 10px; padding: 15px;
            border-radius: 15px; display: flex; align-items: center;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>〈</span>
        <span style="font-weight: bold;">mDowód</span>
        <div class="flag"></div>
    </div>

    <div class="id-card">
        <div class="row">
            <div class="photo-area">
                <div style="position: absolute; bottom: 5px; right: 5px; opacity: 0.2;">🇵🇱</div>
            </div>
            <div class="data-area">
                <div class="field"><div class="label">Nazwisko</div><div class="value">KOWALSKI</div></div>
                <div class="field"><div class="label">Imię (imiona)</div><div class="value">JAN ADAM</div></div>
                <div class="field"><div class="label">Obywatelstwo</div><div class="value">POLSKIE</div></div>
                <div class="field"><div class="label">Numer PESEL</div><div class="value">01234567890</div></div>
            </div>
        </div>
        <div class="status-time">Ostatnia aktualizacja: 27.04.2026 17:35:12</div>
    </div>

    <div class="menu-item">
        <span style="margin-right: 15px;">👤</span>
        <span style="font-weight: bold; font-size: 14px;">Potwierdź swoje dane</span>
    </div>
</body>
</html>
